project:
  type: website
  output-dir: docs
  resources:
  - CNAME
  # Each deck in presentations/<name>/ is static HTML built by
  # scripts/pptx-to-html/build_deck.py. Listing it here makes Quarto copy it
  # into docs/presentations/ on every render instead of wiping it.
  - presentations/*/**

website:
  title: "danolner_dot_net"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - about.qmd

format:
  html:
    theme:
      - yeti
    fontsize: 1.2em
    linestretch: 1.7
    css: styles.css
    toc: true



